
name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'android/**'
      - '.github/workflows/android-debug-apk.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      EXAMBASE_API_BASE_URL: ${{ vars.EXAMBASE_API_BASE_URL }}

    steps:
      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Show Android SDK information
      - name: Show Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      # 5. Setup Gradle
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 6. Check API URL
      - name: Validate API endpoint
        shell: bash
        run: |
          if [[ -z "$EXAMBASE_API_BASE_URL" ]]; then
            echo "::warning::EXAMBASE_API_BASE_URL is empty."
            echo "Using emulator default URL."
          elif [[ "$EXAMBASE_API_BASE_URL" != https://* ]]; then
            echo "::error::API URL must start with https://"
            exit 1
          else
            echo "HTTPS API endpoint configured."
          fi

      # 7. Build APK
      - name: Build Debug APK
        working-directory: android
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug \
            -PEXAMBASE_API_BASE_URL="$EXAMBASE_API_BASE_URL"

      # 8. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK file not found!"
            exit 1
          fi

          echo "APK successfully generated."
          ls -lh "$APK"

      # 9. Upload reports if build fails
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: android/**/build/reports
          if-no-files-found: ignore
          retention-days: 7

      # 10. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExamBaseAI-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 11. Build summary
      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# ExamBaseAI Android APK"
            echo ""
            echo "Build status: ${{ job.status }}"
            echo ""
            echo "APK: app-debug.apk"
            echo ""
            if [[ -z "$EXAMBASE_API_BASE_URL" ]]; then
              echo "Warning: No public backend URL configured."
            else
              echo "API endpoint configured."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
